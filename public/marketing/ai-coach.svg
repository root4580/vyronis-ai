    <text x="1232" y="604" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" letter-spacing="1">VERDICT</text>
    <text x="1232" y="626" fill="#f87171" font-family="system-ui,sans-serif" font-size="16" font-weight="700">SKIP</text>


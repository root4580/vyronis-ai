    <rect x="784" y="808" width="572" height="52" rx="14" fill="#060a10" stroke="#ffffff12"/>
    <text x="808" y="840" fill="#64748b" font-family="system-ui,sans-serif" font-size="14">Message Vyronis...</text>
    <rect x="1296" y="820" width="44" height="28" rx="14" fill="url(#cyanBar)"/>
    <path d="M1314 834 L1326 834 L1320 828 Z" fill="#041014"/>

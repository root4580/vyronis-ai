<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Vyronis AI Trade Coach SKIP verdict with chart analysis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1219"/>
      <stop offset="55%" stop-color="#0a0f14"/>
      <stop offset="100%" stop-color="#070b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="28%" r="45%">

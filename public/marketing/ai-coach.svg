    <text x="828" y="682" fill="#64748b" font-family="system-ui,sans-serif" font-size="10" letter-spacing="1.2">DEEP ANALYSIS</text>
    <text x="828" y="708" fill="#34d399" font-family="system-ui,sans-serif" font-size="13">Trend direction ........ Bullish breakout</text>
    <text x="828" y="732" fill="#34d399" font-family="system-ui,sans-serif" font-size="13">HTF alignment ........ 90% aligned</text>
    <text x="828" y="756" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="13">Confirmation quality . No BOS close at AOI</text>


    <text x="824" y="604" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" letter-spacing="1">SETUP</text>
    <text x="824" y="626" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="20" font-weight="700">73</text>
    <rect x="944" y="582" width="124" height="54" rx="12" fill="#060a10" stroke="#ffffff0a"/>
    <text x="960" y="604" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" letter-spacing="1">STATE</text>
    <text x="960" y="626" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="20" font-weight="700">58</text>
    <rect x="1080" y="582" width="124" height="54" rx="12" fill="#060a10" stroke="#ffffff0a"/>
    <text x="1096" y="604" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" letter-spacing="1">RISK</text>
    <text x="1096" y="626" fill="#f87171" font-family="system-ui,sans-serif" font-size="16" font-weight="700">HIGH</text>
